# Render blueprint for the API (FastAPI). The website runs on Hostinger; see DEPLOY.md.
# Secrets (MYSQL_*) are entered in the Render dashboard and never committed.
services:
  - type: web
    name: impostr-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        # The hostingersite.com address is the Hostinger app's temporary domain.
        value: https://impostr.live,https://www.impostr.live,https://mediumspringgreen-sardine-361504.hostingersite.com
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
